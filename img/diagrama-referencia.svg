x="12.5" ry="12.5" style="stroke: #334155; stroke-width: 1.5;" width="303" x="1300.7813" y="307.0592"/><text fill="#0F172A" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="195" x="1310.7813" y="329.8873">CT-05: Autenticação com Sucesso</text><text fill="#0F172A" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="209" x="1310.7813" y="346.2314">Lente: Caminho Perfeito (Happy Path)</text><text fill="#0F172A" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="176" x="1310.7813" y="362.5755">Fonte da Verdade (Test Oracle):</text><text fill="#0F172A" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="283" x="1310.7813" y="378.9196">Zerar contador de falhas, criar Sessão Autenticada</text><text fill="#0F172A" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="214" x="1310.7813" y="395.2637">e redirecionar para o Painel do Cliente</text><ellipse cx="458.5" cy="482.4719" fill="#FFFFFF" filter="url(#fenavany49r28)" rx="11" ry="11" style="stroke: #000000; stroke-width: 1.0;"/><ellipse cx="458.5" cy="482.4719" fill="#000000" rx="6" ry="6" style="stroke: #7F7F7F; stroke-width: 1.0;"/><line style="stroke: #334155; stroke-width: 1.5;" x1="458.5" x2="458.5" y1="54.5158" y2="74.5158"/><polygon fill="#334155" points="454.5,64.5158,458.5,74.5158,462.5,64.5158,458.5,68.5158" style="stroke: #334155; stroke-width: 1.0;"/><line style="stroke: #334155; stroke-width: 1.5;" x1="169.5" x2="169.5" y1="272.5443" y2="307.5443"/><polygon fill="#334155" points="165.5,297.5443,169.5,307.5443,173.5,297.5443,169.5,301.5443" style="stroke: #334155; stroke-width: 1.0;"/><line style="stroke: #334155; stroke-width: 1.5;" x1="476.2813" x2="476.2813" y1="312.5081" y2="347.5081"/><polygon fill="#334155" points="472.2813,337.5081,476.2813,347.5081,480.2813,337.5081,476.2813,341.5081" style="stroke: #334155; stroke-width: 1.